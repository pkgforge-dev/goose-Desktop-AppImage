name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 1/7 * *"
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-24.04, name: Build AppImage, arch: x86_64 }
          - { runs-on: ubuntu-24.04-arm, name: Build AppImage, arch: aarch64 }
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@ba7321e11074f9e387a0634e653d09b115d576cd
      - name: Install Dependencies
        run: /bin/sh ./get-dependencies.sh
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  build-additional-cpu-arches:
    if: false
    name: "${{ matrix.name }} (${{ matrix.arch }})"
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Build AppImage, arch: riscv64, platform: linux/riscv64 }
          - { name: Build AppImage, arch: loongarch64, platform: linux/loong64 }
          - { name: Build AppImage, arch: ppc64le, platform: linux/ppc64le }
          - { name: Build AppImage, arch: ppc64, platform: linux/ppc64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build AppImage (emulated)
        uses: pkgforge-dev/anylinux-setup-action/emulated@ba7321e11074f9e387a0634e653d09b115d576cd
        with:
          platform: ${{ matrix.platform }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AppImage-${{ matrix.arch }}
          path: dist

  release:
    if: >-
      ${{ !cancelled() && github.ref_name == 'main'
      && needs.build.result == 'success'
      && needs.build-additional-cpu-arches.result != 'failure' }}
    needs: [build, build-additional-cpu-arches]
    permissions: write-all
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@4ed3d48ccb065352b6e6c0db6d39885b201c54a0
